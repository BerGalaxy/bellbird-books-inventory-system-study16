{% extends "base.html" %}
{% block title %}Edit Order{% endblock %}
{% block content %}

<h2>Edit Order #{{ order.id }}</h2>
<div class="form-card">
    <form method="POST">
        <label>Book Title *</label>
        <input type="text" name="book_title" value="{{ order.book_title }}" required>

        <label>Author</label>
        <input type="text" name="author" value="{{ order.author or '' }}">

        <label>Quantity</label>
        <input type="number" name="quantity" value="{{ order.quantity }}" min="1">

        <button type="submit" class="btn gold">Save Changes</button>
    </form>
</div>

{% endblock %}
